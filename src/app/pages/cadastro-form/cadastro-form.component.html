<div class="cadastro-form">
  <div class="cadastro-form__container">
    <div class="cadastro-form__card">
      <h2 class="cadastro-form__title">Crie seu cadastro</h2>
      <form [formGroup]="cadastroForm" (ngSubmit)="onNext()">
        <div class="cadastro-form_section">
          <h3 class="cadastro-form__section-title">Qual a área de atuação?</h3>

          <div class="cadastro-form__radio-group">
            <app-radio-option
              *ngFor="let area of areasAtuacao"
              [id]="area.id"
              [name]="'areaAtuacao'"
              [value]="area.value"
              [label]="area.label"
              [checked]="cadastroForm.get('areaAtuacao')?.value === area.value"
              (selectionChange)="onAreaChange($event)"
            ></app-radio-option>
            <div
              *ngIf="
                cadastroForm.get('areaAtuacao')?.touched &&
                cadastroForm.get('areaAtuacao')?.invalid
              "
              class="cadastro-form__error"
            >
              Selecione uma área de atuação
            </div>
          </div>
        </div>

        <div class="cadastro-form__section">
          <h3 class="cadastro-form__section-title">Nível de experiência</h3>
          <app-experience-level
            [levels]="niveisExperiencia"
            [selectedLevel]="cadastroForm.get('nivelExperiencia')?.value"
            (levelChange)="onLevelChange($event)"
          ></app-experience-level>
          <div
            *ngIf="
              cadastroForm.get('nivelExperiencia')?.touched &&
              cadastroForm.get('nivelExperiencia')?.invalid
            "
            class="cadastro-form__error"
          >
            Selecione um nível de epxeriência
          </div>
        </div>

        <div class="cadastro-form__actions">
          <app-button
            text="Anterior"
            type="outline"
            icon="fas fa-arrow-left"
            iconPosition="left"
            (clicked)="onPrevious()"
          ></app-button>
          <app-button
            text="Próximo"
            type="primary"
            icon="fas fa-arrow-left"
            iconPosition="right"
            [disabled]="cadastroForm.invalid"
            (clicked)="onNext()"
          ></app-button>
        </div>
      </form>
    </div>
  </div>
</div>
