<div class="cadastro-form">
  <div class="cadastro-form__container">
    <div class="cadastro-form__card">
      <h2 class="cadastro-form__title">{{ formConfig.title }}</h2>

      <p class="cadastro-form__description">
        {{ formConfig.description }}
      </p>

      <form [formGroup]="dadosPessoaisForm" (ngSubmit)="onProximo()">
        <ng-container *ngFor="let field of formConfig.fields">
          <!-- =============================== -->
          <!-- Campos para: Texto / Email -->
          <!-- =============================== -->
          <ng-container
            *ngIf="isFieldType(field, 'text') || isFieldType(field, 'email')"
          >
            <div
              class="cadastro-form__field"
              [ngClass]="{
                'cadastro-form__field--half': field.size === 'half',
              }"
            >
              <label [for]="field.formControlName" class="cadastro-form__label">
                {{ field.label }}
              </label>

              <input
                [id]="field.id || field.formControlName"
                [type]="field.type"
                [formControlName]="field.formControlName"
                [placeholder]="field.placeholder || ''"
                class="cadastro-form__input"
              />

              <div
                *ngIf="
                  dadosPessoaisForm.get(field.formControlName)?.invalid &&
                  dadosPessoaisForm.get(field.formControlName)?.touched
                "
                class="cadastro-form__error"
              >
                <ng-container
                  *ngFor="let error of field.errorMessages | keyvalue"
                >
                  <span
                    *ngIf="
                      dadosPessoaisForm.get(field.formControlName)?.errors?.[
                        error.key
                      ]
                    "
                  >
                    {{ error.value }}
                  </span>
                </ng-container>
              </div>
            </div>
          </ng-container>
        </ng-container>

        <ng-container *ngIf="hasField('estado') && hasField('cidade')">
          <div class="cadastro-form__row">
            <!-- Campo Estado -->
            <div class="cadastro-form__field cadastro-form__field--half">
              <label for="estado" class="cadastro-form__label">
                {{ getFieldByName("estado").label }}
              </label>

              <select
                id="estado"
                class="cadastro-form__select"
                formControlName="estado"
              >
                <option value="" disabled selected>
                  {{ getFieldByName("estado").placeholder || "Selecione" }}
                </option>
                <ng-container *ngIf="estados.length > 0">
                  <option *ngFor="let estado of estados" [value]="estado.sigla">
                    {{ estado.nome + " (" + estado.sigla + ")" }}
                  </option>
                </ng-container>
              </select>

              <div
                *ngIf="
                  dadosPessoaisForm.get('estado')?.invalid &&
                  dadosPessoaisForm.get('estado')?.touched
                "
                class="cadastro-form__error"
              >
                <ng-container
                  *ngFor="
                    let error of getFieldByName('estado').errorMessages
                      | keyvalue
                  "
                >
                  <span
                    *ngIf="dadosPessoaisForm.get('estado')?.errors?.[error.key]"
                  >
                    {{ error.value }}
                  </span>
                </ng-container>
              </div>
            </div>

            <!-- Campo Cidade -->
            <div class="cadastro-form__field cadastro-form__field--half">
              <label for="cidade" class="cadastro-form__label">
                {{ getFieldByName("cidade").label }}
              </label>

              <select
                id="cidade"
                class="cadastro-form__select"
                formControlName="cidade"
                [disabled]="
                  cidades.length === 0 ||
                  !dadosPessoaisForm.get('estado')?.value
                "
              >
                <option value="" disabled selected>
                  {{
                    cidades.length === 0 &&
                    dadosPessoaisForm.get("estado")?.value
                      ? "Carregando..."
                      : getFieldByName("cidade").placeholder || "Selecione"
                  }}
                </option>
                <ng-container *ngIf="cidades.length > 0">
                  <option *ngFor="let cidade of cidades" [value]="cidade.nome">
                    {{ cidade.nome }}
                  </option>
                </ng-container>
              </select>

              <div
                *ngIf="
                  dadosPessoaisForm.get('cidade')?.invalid &&
                  dadosPessoaisForm.get('cidade')?.touched
                "
                class="cadastro-form__error"
              >
                <ng-container
                  *ngFor="
                    let error of getFieldByName('cidade').errorMessages
                      | keyvalue
                  "
                >
                  <span
                    *ngIf="dadosPessoaisForm.get('cidade')?.errors?.[error.key]"
                  >
                    {{ error.value }}
                  </span>
                </ng-container>
              </div>
            </div>
          </div>

          <ng-container *ngIf="hasField('senha') && hasField('confirmarSenha')">
            <div class="cadastro-form__row">
              <!-- Campo Senha -->
              <div class="cadastro-form__field cadastro-form__field--half">
                <label for="senha" class="cadastro-form__label">{{
                  getFieldByName("senha").label
                }}</label>
                <input
                  id="senha"
                  type="password"
                  class="cadastro-form__input"
                  formControlName="senha"
                />
                <div
                  *ngIf="
                    dadosPessoaisForm.get('senha')?.invalid &&
                    dadosPessoaisForm.get('senha')?.touched
                  "
                  class="cadastro-form__error"
                >
                  <ng-container
                    *ngFor="
                      let error of getFieldByName('senha').errorMessages
                        | keyvalue
                    "
                  >
                    <span
                      *ngIf="
                        dadosPessoaisForm.get('senha')?.errors?.[error.key]
                      "
                      >{{ error.value }}</span
                    >
                  </ng-container>
                </div>
              </div>

              <!-- Campo Confirma Senha -->
              <div class="cadastro-form__field cadastro-form__field--half">
                <label for="confirmaSenha" class="cadastro-form__label">{{
                  getFieldByName("confirmarSenha").label
                }}</label>
                <input
                  id="confirmarSenha"
                  type="password"
                  class="cadastro-form__input"
                  formControlName="confirmarSenha"
                />
                <div
                  *ngIf="
                    dadosPessoaisForm.get('confirmarSenha')?.invalid &&
                    dadosPessoaisForm.get('confirmarSenha')?.touched
                  "
                  class="cadastro-form__error"
                >
                  <ng-container
                    *ngFor="
                      let error of getFieldByName('confirmarSenha')
                        .errorMessages | keyvalue
                    "
                  >
                    <span
                      *ngIf="
                        dadosPessoaisForm.get('confirmarSenha')?.errors?.[
                          error.key
                        ]
                      "
                      >{{ error.value }}</span
                    >
                  </ng-container>
                </div>
              </div>
            </div>
            <div style="display: flex; justify-content: center">
              <div
                *ngIf="
                  dadosPessoaisForm.errors?.['passwordFieldsMissmatch'] &&
                  dadosPessoaisForm.get('confirmarSenha')?.touched
                "
                class="cadastro-form__error"
              >
                As senhas informadas não correspondem
              </div>
            </div>
          </ng-container>
        </ng-container>

        <div class="cadastro-form__actions">
          <app-button
            text="Anterior"
            type="outline"
            icon="fas fa-arrow-left"
            iconPosition="left"
            (clicked)="onAnterior()"
          >
          </app-button>

          <app-button
            text="Próximo"
            type="primary"
            icon="fas fa-arrow-right"
            iconPosition="right"
            [disabled]="dadosPessoaisForm.invalid"
            (clicked)="onProximo()"
          >
          </app-button>
        </div>
      </form>
    </div>
  </div>
</div>
